## Synthetic population pipeline for Toulouse
## based on the synpp package

# This is the path to a directory where the pipeline can store temporary data
working_directory: /Users/yvesb/Documents/eqasim-france/cache

# This section defines which parts of the pipeline should be run
run:
  - synthesis.output # To create the output population in the output_path (see below)
  - synthesis.population.llm_agents # Export population as JSON for the LLM-agents GAMA simulation
  # - matsim.output # Uncomment, if you want to run the full simulation (you'll need Java for that)

# Here the configuraiton of the pipeline starts
config:
  # Some general configuration
  processes: 4

  # Define whether to use ENTD or EGT as the household travel survey (HTS)
  hts: entd

  # ── Appariement HTS : ne pas perdre l'âge (ticket 008, A1.a) ────────────────
  # `filter_hts` (défaut True, cf. data/hts/entd/filtered.py) réduisait l'ENTD aux
  # seuls répondants du département 31 : le vivier de donneurs tombait de ~18 000 à
  # quelques centaines. Les strates n'atteignaient plus `matching_minimum_observations`,
  # la dégradation retombait au niveau 1-2 et `age_class` disparaissait de
  # l'appariement — un écolier de 9 ans héritait alors d'un donneur adulte, avec son
  # permis de conduire et sa chaîne domicile → travail.
  filter_hts: false

  # ── Journées donneuses = jours de classe (ticket 031, § 1.2) ─────────────────
  # L'EMC² 2023 s'enquête hors vacances scolaires ; l'ENTD 2008 couvre l'année. Sans ce
  # filtre, 50 à 54 % seulement des 6-17 ans du vivier avaient une activité d'études un jour
  # de semaine (EMC² : 90 à 95 %) : les journées de vacances (`V2_VAC_SCOL = 1`, 20 % des
  # journées) et le mercredi des écoliers de 2008 (`V2_JOUR_DEP = 4`) entraient dans un jour
  # de semaine simulé. Le filtre s'applique à TOUS les donneurs (cohérence avec l'enquête de
  # référence) ; la règle du mercredi ne vise que les moins de 11 ans (0 la désactive).
  # Coût mesuré : 15 687 → 12 392 donneurs de jours de référence (−21 %)  la plus petite classe d'âge en garde 858
  # pour un seuil de 5. Témoin en sortie du stage data.hts.entd.cleaned : part des scolaires
  # mobiles avec un trajet vers l'école (alarme sous 85 %).
  hts_school_days_only: true
  hts_exclude_wednesday_under_age: 11

  # La dégradation retire les colonnes **par la fin** (`column_indices[:level]`,
  # synthesis/population/matched.py). L'attribut placé en tête est donc le dernier
  # abandonné : `age_class` d'abord, pour qu'un enfant ne soit jamais apparié à un
  # adulte tant qu'il reste un donneur du bon âge.
  matching_attributes:
    - age_class
    - sex
    - any_cars
    - socioprofessional_class
    - departement_id
  # Bornes des classes d'âge de l'appariement (défaut eqasim : 14, 29, 44, 59, 74). La borne
  # 17 sépare les lycéens (15-17) des jeunes actifs (18-29) : dans la classe 15-29, un scolaire
  # de 16 ans héritait d'une chaîne d'actif — 80,4 % des 15-17 ans mobiles avec une activité
  # d'études contre 92 % chez les 6-14 ans (mesuré le 2026-09-03, ticket 031, décision de l'auteur).
  matching_age_boundaries: [14, 17, 29, 44, 59, 74, 1000]
  # Vivier national restauré, mais strates plus fines : un seuil plus bas évite de
  # dégrader dès le niveau 5.
  matching_minimum_observations: 5

  # extra_enriched_attributes: ["is_passenger", "number_of_trips"]

  # Define sampling rate and random seed for the output population
  sampling_rate: 0.01
  random_seed: 1234

  # Paths to the input data and where the output should be stored
  data_path: /Users/yvesb/Documents/eqasim-france/data
  output_path: /Users/yvesb/Documents/eqasim-france/output
  output_prefix: toulouse_

  # Only interesting if you run the simulation
  java_memory: 14G

  # Activate if you want to run mode choice
  mode_choice: false

  # ── Périmètre d'étude : les 453 communes de l'EMC² 2023, six départements (ticket 031) ──
  # Le cadre de tirage est la LISTE DES COMMUNES du périmètre d'enquête (`communes_file`,
  # produit par `make communes-couronnes` dans llm-agents-gama), croisée avec `departments`.
  # Attendu, journalisé par le stage data.spatial.codes : 31 → 346, 32 → 38, 81 → 27,
  # 82 → 22, 09 → 10, 11 → 10 communes. Chaque département demandé exige sa BD TOPO
  # (bdtopo_path) et sa BAN (ban_path) : le pipeline s'arrête sinon, il ne peuple pas
  # « ce qu'il peut ». Pour ne servir que la Haute-Garonne (346 communes, version du
  # ticket 026), réduire `departments` à ["31"] — la limite est alors chiffrée dans
  # docs/arch/perimetre-population.md (limite n°6).
  regions: []
  departments: ["31", "32", "81", "82", "09", "11"]
  communes_file: /Users/yvesb/Documents/Projects/llm-agents-gama/llm_module/data/commune_couronne.json
  gtfs_path: gtfs_toulouse
  osm_path: osm_toulouse
  ban_path: ban_toulouse
  bdtopo_path: bdtopo_toulouse
